<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bossmode — Home Prototype</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <style>
    /* Match the project's font stack */
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>
</head>

<body class="bg-zinc-950 text-white min-h-screen flex">

  <!-- Sidebar placeholder (just to give context) -->
  <div class="w-56 border-r border-zinc-800 bg-zinc-950 shrink-0 flex flex-col">
    <div class="h-12 border-b border-zinc-800 flex items-center px-4">
      <span class="font-bold text-sm text-white tracking-tight">Bossmode</span>
    </div>
    <div class="flex-1 overflow-y-auto p-2 opacity-40">
      <div class="text-[10px] uppercase tracking-wider text-zinc-500 px-2 py-2">Rooms</div>
      <div class="text-sm text-zinc-400 px-2 py-1.5"># test</div>
      <div class="text-sm text-zinc-400 px-2 py-1.5"># freeu dev</div>
      <div class="text-sm text-zinc-400 px-2 py-1.5"># bossmode dev</div>
      <div class="text-[10px] uppercase tracking-wider text-zinc-500 px-2 py-2 mt-2 border-t border-zinc-800 pt-3">Members</div>
      <div class="text-sm text-zinc-400 px-2 py-1.5">pm</div>
      <div class="text-sm text-zinc-400 px-2 py-1.5">developer</div>
      <div class="text-sm text-zinc-400 px-2 py-1.5">architect</div>
    </div>
  </div>

  <!-- Main content — the home page -->
  <div class="flex-1 flex flex-col items-center overflow-y-auto">

    <div class="w-full max-w-2xl px-6 pt-20 pb-12">

      <!-- Greeting -->
      <h1 class="text-2xl font-semibold text-zinc-100 mb-1">Your Rooms</h1>
      <p class="text-sm text-zinc-500 mb-8">Pick up where you left off, or start something new.</p>

      <!-- Room cards -->
      <div class="space-y-2">

        <!-- Room card — with unread -->
        <button class="w-full text-left group rounded-lg border border-zinc-800 hover:border-zinc-700 bg-zinc-900/50 hover:bg-zinc-900 transition-all px-4 py-3.5 cursor-pointer">
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-2 mb-1">
                <span class="text-sm font-medium text-zinc-100 group-hover:text-white transition-colors">bossmode dev</span>
                <span class="w-2 h-2 rounded-full bg-blue-500 shrink-0" title="Unread messages"></span>
              </div>
              <div class="flex items-center gap-3 text-xs text-zinc-500">
                <span class="font-mono truncate">llm/bossmode</span>
                <span class="text-zinc-700">·</span>
                <span>6 members</span>
              </div>
            </div>
            <div class="flex items-center gap-1.5 shrink-0 mt-0.5">
              <span class="inline-flex items-center gap-1 text-[10px] text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 rounded px-1.5 py-0.5">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                2 working
              </span>
            </div>
          </div>
        </button>

        <!-- Room card — idle -->
        <button class="w-full text-left group rounded-lg border border-zinc-800 hover:border-zinc-700 bg-zinc-900/50 hover:bg-zinc-900 transition-all px-4 py-3.5 cursor-pointer">
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-2 mb-1">
                <span class="text-sm font-medium text-zinc-100 group-hover:text-white transition-colors">freeu dev</span>
              </div>
              <div class="flex items-center gap-3 text-xs text-zinc-500">
                <span class="font-mono truncate">llm/FreeU</span>
                <span class="text-zinc-700">·</span>
                <span>4 members</span>
              </div>
            </div>
          </div>
        </button>

        <!-- Room card — idle, no members -->
        <button class="w-full text-left group rounded-lg border border-zinc-800 hover:border-zinc-700 bg-zinc-900/50 hover:bg-zinc-900 transition-all px-4 py-3.5 cursor-pointer">
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-2 mb-1">
                <span class="text-sm font-medium text-zinc-100 group-hover:text-white transition-colors">test</span>
              </div>
              <div class="flex items-center gap-3 text-xs text-zinc-500">
                <span class="font-mono truncate">home/fish</span>
                <span class="text-zinc-700">·</span>
                <span>2 members</span>
              </div>
            </div>
          </div>
        </button>

        <!-- New Room button -->
        <button class="w-full text-left group rounded-lg border border-dashed border-zinc-800 hover:border-zinc-600 hover:bg-zinc-900/30 transition-all px-4 py-3.5 cursor-pointer">
          <div class="flex items-center gap-2 text-zinc-500 group-hover:text-zinc-300 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span class="text-sm">New Room</span>
          </div>
        </button>

      </div>

    </div>

  </div>

</body>
</html>
