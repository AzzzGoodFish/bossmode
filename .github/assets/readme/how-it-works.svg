<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">How proven organizational patterns map to Bossmode</title>
  <desc id="desc">Clear roles map to Agents and Room-local Members. A shared workplace maps to a Room. Communication and handoffs map to Chat and mentions. Accountability maps to Tasks. Shared memory maps to Library. Individual state and recovery map to member Context and Session controls.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#142326" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#62807d"/></marker>
    <style>
      .eyebrow{font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.4px;fill:#5d6b70}.title{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17242a}.label{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#24343a}.body{font:400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#607077}.mono{font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#285956}.row{fill:#fbfaf6;stroke:#cbd0cb;stroke-width:1}.carrier{fill:#e7ece7;stroke:#c6d1ca;stroke-width:1}
    </style>
  </defs>
  <rect width="1400" height="650" rx="28" fill="#f0ede5"/>
  <text x="58" y="55" class="eyebrow">THE WAY GREAT TEAMS ALREADY WORK</text>
  <text x="58" y="91" class="title">Bossmode carries familiar organizational patterns into human–agent collaboration.</text>
  <text x="58" y="128" class="eyebrow">PROVEN ORGANIZATIONAL PATTERN</text>
  <text x="684" y="128" class="eyebrow">BOSSMODE CARRIER</text>

  <g filter="url(#shadow)">
    <rect class="row" x="58" y="148" width="490" height="62" rx="14"/><circle cx="84" cy="179" r="10" fill="#2f8c84"/><text x="105" y="176" class="label">Clear roles and specialization</text><text x="105" y="196" class="body">People own distinct responsibilities.</text>
    <rect class="carrier" x="684" y="148" width="658" height="62" rx="14"/><text x="708" y="176" class="label">Agent + Room-local Member</text><text x="708" y="196" class="body">Define the role once; instantiate concrete teammates as needed.</text>
    <path d="M564 179H665" stroke="#62807d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <rect class="row" x="58" y="220" width="490" height="62" rx="14"/><circle cx="84" cy="251" r="10" fill="#527d76"/><text x="105" y="248" class="label">A shared place to work</text><text x="105" y="268" class="body">The team sees the same work and outcome.</text>
    <rect class="carrier" x="684" y="220" width="658" height="62" rx="14"/><text x="708" y="248" class="label">Room</text><text x="708" y="268" class="body">One persistent collaboration space for you and named members.</text>
    <path d="M564 251H665" stroke="#62807d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <rect class="row" x="58" y="292" width="490" height="62" rx="14"/><circle cx="84" cy="323" r="10" fill="#6e8a67"/><text x="105" y="320" class="label">Discussion, correction, and handoffs</text><text x="105" y="340" class="body">Teams coordinate and challenge assumptions.</text>
    <rect class="carrier" x="684" y="292" width="658" height="62" rx="14"/><text x="708" y="320" class="label">Chat + @member</text><text x="708" y="340" class="body">Direct, question, delegate, and hand off work through language.</text>
    <path d="M564 323H665" stroke="#62807d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <rect class="row" x="58" y="364" width="490" height="62" rx="14"/><circle cx="84" cy="395" r="10" fill="#d4a534"/><text x="105" y="392" class="label">Commitments and accountability</text><text x="105" y="412" class="body">Ownership and progress stay explicit.</text>
    <rect class="carrier" x="684" y="364" width="658" height="62" rx="14"/><text x="708" y="392" class="label">Tasks</text><text x="708" y="412" class="body">Persistent commitments with assignees, status, and comments.</text>
    <path d="M564 395H665" stroke="#62807d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <rect class="row" x="58" y="436" width="490" height="62" rx="14"/><circle cx="84" cy="467" r="10" fill="#5d8b67"/><text x="105" y="464" class="label">Organizational knowledge and memory</text><text x="105" y="484" class="body">Decisions and learning survive the meeting.</text>
    <rect class="carrier" x="684" y="436" width="658" height="62" rx="14"/><text x="708" y="464" class="label">Traceable Chat + Library</text><text x="708" y="484" class="body">Keep the original record and distill durable knowledge.</text>
    <path d="M564 467H665" stroke="#62807d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <rect class="row" x="58" y="508" width="490" height="62" rx="14"/><circle cx="84" cy="539" r="10" fill="#777f9c"/><text x="105" y="536" class="label">Individual state and recovery</text><text x="105" y="556" class="body">A teammate can be observed and brought back.</text>
    <rect class="carrier" x="684" y="508" width="658" height="62" rx="14"/><text x="708" y="536" class="label">Context + Session + Member Control</text><text x="708" y="556" class="body">Compact, reload, restart, or reset one member without losing the Room record.</text>
    <path d="M564 539H665" stroke="#62807d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  </g>

  <text x="58" y="616" class="mono">DEFINE</text><text x="135" y="616" class="body">roles</text>
  <text x="250" y="616" class="mono">ORGANIZE</text><text x="350" y="616" class="body">responsibility</text>
  <text x="508" y="616" class="mono">GROW</text><text x="566" y="616" class="body">through explicit feedback</text>
  <text x="825" y="616" class="mono">REMEMBER</text><text x="928" y="616" class="body">the facts that make the organization smarter</text>
</svg>
